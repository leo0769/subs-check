    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    tolerance: 50
    lazy: false
  - name: "🔄 故障转移"
    type: fallback
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: false
