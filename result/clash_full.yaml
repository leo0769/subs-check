proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔄 故障转移"
      - "🎯 手动选择"
      - "⚖️ 负载均衡"
      - DIRECT
  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    tolerance: 50
    lazy: false
  - name: "🔄 故障转移"
    type: fallback
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: false
  - name: "🎯 手动选择"
    type: select
    include-all: true
  - name: "⚖️ 负载均衡"
    type: load-balance
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: false

rules:
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
