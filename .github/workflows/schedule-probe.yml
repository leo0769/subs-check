name: Schedule Probe

on:
  workflow_dispatch:
  schedule:
    # 每 10 分钟跑一次，用于快速验证 fork 的 schedule 是否真正触发（验证后删除）
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "schedule probe fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "event = ${{ github.event_name }}"
