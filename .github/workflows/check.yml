name: Check Subscriptions

on:
  workflow_dispatch:

  schedule:
    - cron: '17 */6 * * *' # 每 6 小时（UTC，错开整点）

permissions:
  contents: write

concurrency:
  group: subs-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:

    - name: 迁出代码
      uses: actions/checkout@v4

    - name: 下载 subs-check
      run: |
        curl -sL -o sc.tar.gz https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz
        tar xzf sc.tar.gz
        chmod +x subs-check
        ./subs-check --help 2>&1 | head -5 || true

    - name: 运行节点检测
      run: |
        ./subs-check > check.log 2>&1 &
        BGPID=$!
        # 最长等待 24 分钟，等第一轮检测完成
        for i in $(seq 1 48); do
          if [ -f output/all.yaml ]; then
            echo "检测完成，等待 mihomo.yaml 等附属文件生成..."
            break
          fi
          sleep 30
        done
        # 再等附属文件（mihomo.yaml / base64.txt），最多 3 分钟
        for i in $(seq 1 6); do
          if [ -f output/mihomo.yaml ] && [ -f output/base64.txt ]; then break; fi
          sleep 30
        done
        sleep 15
        kill $BGPID 2>/dev/null || pkill -f 'subs-check' || true
        sleep 2
        # .gitignore 忽略 output/，复制到 result/ 再提交
        mkdir -p result
        cp output/*.yaml output/base64.txt result/ 2>/dev/null || true
        echo "===== 结果文件 ====="
        ls -la result/ 2>/dev/null || echo "无结果文件"
        echo "===== 日志摘要 ====="
        tail -40 check.log || true

    - name: 提交结果
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add result check.log 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "本次无可保留节点或无变化"
        else
          git commit -m "节点检测 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
        fi
