name: Check Subscriptions

on:
  workflow_dispatch:

  schedule:
    # UTC 00:17 / 06:17 / 12:17 / 18:17 = 北京时间 08:17 / 14:17 / 20:17 / 次日 02:17
    # 刻意用第 17 分钟，避开整点(:00/:30)高峰，降低排队延迟/丢弃概率
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: subs-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:

    - name: 迁出代码
      uses: actions/checkout@v4

    - name: 下载 subs-check
      run: |
        curl -sL -o sc.tar.gz https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz
        tar xzf sc.tar.gz
        chmod +x subs-check
        ./subs-check --help 2>&1 | head -5 || true

    - name: 运行节点检测
      run: |
        ./subs-check > check.log 2>&1 &
        BGPID=$!
        # 最长等待 24 分钟，等第一轮检测完成
        for i in $(seq 1 48); do
          if [ -f output/all.yaml ]; then
            echo "检测完成，等待 mihomo.yaml 等附属文件生成..."
            break
          fi
          sleep 30
        done
        # 再等附属文件（mihomo.yaml / base64.txt），最多 3 分钟
        for i in $(seq 1 6); do
          if [ -f output/mihomo.yaml ] && [ -f output/base64.txt ]; then break; fi
          sleep 30
        done
        sleep 15
        kill $BGPID 2>/dev/null || pkill -f 'subs-check' || true
        sleep 2
        # .gitignore 忽略 output/ 和 mihomo.yaml，重命名后强加提交
        mkdir -p result
        cp output/all.yaml output/base64.txt result/ 2>/dev/null || true
        # 用本地极简模板合成 clash_full.yaml（无联网 rule-providers，规避被墙的规则集 CDN）
        python3 scripts/build_simple_clash.py || echo "⚠️ 合成 clash_full.yaml 失败，保留 all.yaml"
        git add result check.log 2>/dev/null || true
        git add -f result/clash_full.yaml 2>/dev/null || true
        echo "===== 结果文件 ====="
        ls -la result/ 2>/dev/null || echo "无结果文件"
        echo "===== 日志摘要 ====="
        tail -40 check.log || true

    - name: 提交结果
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add result check.log 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "本次无可保留节点或无变化"
        else
          git commit -m "节点检测 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
        fi

    - name: 生成邮件报告
      id: report
      if: always()
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python3 scripts/mail_report.py
        USABLE=$(sed 's/\x1b\[[0-9;]*m//g' check.log | grep -oP '(?<=可用节点数量: )\d+' | tail -1)
        echo "SUBJECT=📡 节点检测报告 $(TZ='Asia/Shanghai' date '+%m-%d %H:%M') · 可用节点 ${USABLE:-0} 个" >> "$GITHUB_OUTPUT"

    - name: 发送邮件通知
      if: always() && hashFiles('mail_report.md') != ''
      continue-on-error: true
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT || 465 }}
        secure: true
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASS }}
        subject: ${{ steps.report.outputs.SUBJECT }}
        to: ${{ secrets.MAIL_TO }}
        from: subs-check <${{ secrets.SMTP_USER }}>
        convert_markdown: true
        body: file://mail_report.md
